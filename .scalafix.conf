rules = [
  OrganizeImports
  DisableSyntax
  LeakingImplicitClassVal
  NoValInForComprehension
  RedundantSyntax
]

OrganizeImports {
  groupedImports = Merge
  groups = [
    "re:javax?\\."
    "scala."
    "*"
    "com.disneystreaming."
  ]
  removeUnused = false  # Not supported in Scala 3
  expandRelative = true
}

DisableSyntax {
  noVars = false
  noThrows = false
  noNulls = false
  noReturns = true
  noWhileLoops = false
  noAsInstanceOf = false
  noIsInstanceOf = false
  noXml = true
  noDefaultArgs = false
  noFinalVal = true
  noFinalize = true
  noValPatterns = false
}
